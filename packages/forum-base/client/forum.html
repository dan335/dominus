<template name="forum">
  {{> forumBefore}}
  {{#if hasAccess}}
    {{> forumContainer}}
  {{else}}
  <div class="container-fluid" style="margin-top: -350px;">
    <div class="container">
      <div class="row">
        <div class="col-xs-12">
          <div class="landingGameContainer">
            <div class="forumBoxBody" style="text-align:center;">
              <br><br><br><br>
              {{#if isBanned}}
                Your account has been banned.
                <br><br>
                If you think this is a mistake, contact us on <a href="https://discord.gg/b59g5pE" target="_blank" rel="noopener">Discord</a>.
              {{else}}
                Please login and verify email to access forum.
              {{/if}}
              <br><br><br><br>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
  {{/if}}
  {{> forumAfter}}
</template>
