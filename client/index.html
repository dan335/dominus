<head>
	<meta charset="utf-8">

	<!-- Page title, description, robots, canonical, viewport, theme-color, Open
	     Graph, Twitter cards and JSON-LD are all injected per route by
	     server/seo/seoBoilerplate.js. Do not add a static title element here:
	     the first one in the document wins and would shadow the per-route one. -->

	<link rel="icon" href="/favicon.ico" sizes="any">
	<link rel="icon" type="image/png" sizes="32x32" href="/favicon.png">
	<link rel="manifest" href="/site.webmanifest">

	<!-- android -->
	<meta name="mobile-web-app-capable" content="yes">
	<link rel="shortcut icon" sizes="128x128" href="/icon-196x196.png">
	<!-- iOS -->
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="translucent-black">
	<meta name="apple-mobile-web-app-title" content="Dominus">
	<link rel="apple-touch-icon" href="/touch-icon-iphone.png">
	<link rel="apple-touch-icon" sizes="76x76" href="/touch-icon-ipad.png">
	<link rel="apple-touch-icon" sizes="120x120" href="/touch-icon-iphone-retina.png">
	<link rel="apple-touch-icon" sizes="152x152" href="/touch-icon-ipad-retina.png">
	<script defer src="https://analytics.danp.us/script.js" data-site="qaxtw42i"></script>
</head>
<body>
	{{> Template.dynamic template=route}}
	<script data-site="ODVORAG" src="https://stats.danp.us/script.js" defer></script>
</body>
